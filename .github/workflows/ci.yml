name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12
      - name: Ruff format
        run: uv run --locked --all-extras --python 3.12 ruff format --check .
      - name: Ruff lint
        run: uv run --locked --all-extras --python 3.12 ruff check .
      - name: Test
        run: uv run --locked --all-extras --python 3.12 pytest -q
      - name: Build
        run: uv build
