[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-eval"
version = "0.1.0"
description = "Evaluation runner and MIDI quality checks for Conductor Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"conductor-core[providers,playback] @ git+https://github.com/laceyp99/conductor-core.git@v0.4.0",
	"mido==1.3.3",
	"rich>=14.0.0",
]

[project.optional-dependencies]
dashboard = [
	"dash==4.0.0",
	"dash-bootstrap-components==2.0.4",
	"pandas==2.2.3",
	"plotly==6.0.1",
]
dev = [
	"pytest>=8.3,<9",
	"ruff==0.16.2",
]

[tool.uv]
required-version = ">=0.11.16"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "DTZ", "E4", "E7", "E9", "F", "FLY", "FURB", "I", "N", "NPY", "PERF", "PGH", "PIE", "PT", "PTH", "RET", "RSE", "RUF", "SIM", "UP", "W605"]
